name: Monthly Update Report

on:
  schedule:
    # Dia 1 de cada mês, 11:00 Fortaleza (UTC-3) = 14:00 UTC
    - cron: '0 14 1 * *'

  workflow_dispatch:

# Monthly post: most-updated leaderboard (30-day window) + quiet/broken-source
# health check. The "updated this week" + predictions live in analyze.yml.

jobs:
  run-monthly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run monthly report
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python analyze.py --slack --report monthly --days 30
